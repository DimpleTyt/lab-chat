<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="data:,">
<title>lab-chat</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="boot" id="boot">
  <span class="logo">lab-chat</span>
</div>

<!-- ───────────── ВХОД ───────────── -->
<section class="view view-login" id="view-login" hidden>
  <form class="login-card" id="login-form" novalidate>
    <div class="logo login-logo">lab-chat</div>
    <label class="field">
      <span class="field-label">Логин</span>
      <input class="input" id="login-username" name="username" type="text"
             autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </label>
    <label class="field">
      <span class="field-label">Пароль</span>
      <input class="input" id="login-password" name="password" type="password"
             autocomplete="current-password" required>
    </label>
    <p class="form-error" id="login-error" hidden></p>
    <button class="btn btn-primary btn-block" id="login-submit" type="submit">Войти</button>
  </form>
</section>

<!-- ───────────── ЗАДАНИЕ ───────────── -->
<section class="view view-intake" id="view-intake" hidden>
  <header class="topbar">
    <div class="topbar-left"><span class="logo logo-sm">lab-chat</span></div>
    <div class="topbar-step"></div>
    <div class="topbar-right">
      <span class="user" id="intake-user"></span>
      <button class="btn btn-ghost" id="intake-logout" type="button">выйти</button>
    </div>
  </header>

  <main class="intake-main">
    <div class="intake-box">
      <p class="eyebrow">ЗАДАНИЕ</p>
      <h1 class="intake-title">Вставь текст задания</h1>
      <p class="intake-hint">Всё, что написано в задании, переопределит методичку. Остальное
        останется по умолчанию.</p>

      <div id="intake-form">
        <textarea class="textarea intake-textarea" id="intake-text" rows="10"
                  spellcheck="false" placeholder="Вставь сюда текст варианта…"></textarea>
        <p class="form-error" id="intake-error" hidden></p>
        <div class="intake-actions">
          <span class="kbd-hint">Ctrl+Enter — разобрать</span>
          <button class="btn" id="intake-cancel" type="button" hidden>Отмена</button>
          <button class="btn btn-primary" id="intake-submit" type="button">Разобрать</button>
        </div>
      </div>

      <div class="intake-card" id="intake-card" hidden></div>
      <p class="form-error intake-card-error" id="intake-card-error" hidden></p>
    </div>
  </main>
</section>

<!-- ───────────── ЧАТ ───────────── -->
<section class="view view-chat" id="view-chat" hidden>
  <header class="topbar">
    <div class="topbar-left"><span class="logo logo-sm">lab-chat</span></div>
    <div class="topbar-step" id="chat-step-label">Шаг 0/0</div>
    <div class="topbar-right">
      <span class="user" id="chat-user"></span>
      <button class="btn btn-ghost" id="chat-edit" type="button">задание</button>
      <button class="btn btn-ghost" id="chat-logout" type="button">выйти</button>
    </div>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-bar" id="chat-progress"></div>
  </div>

  <div class="feed-wrap" id="chat-feed-wrap">
    <div class="feed" id="chat-feed" aria-live="polite"></div>
  </div>

  <footer class="composer">
    <div class="composer-inner">
      <textarea class="textarea composer-input" id="chat-input" rows="1"
                spellcheck="false" placeholder="Сообщение…" aria-label="Сообщение"></textarea>
      <button class="btn btn-primary" id="chat-next" type="button" disabled>Дальше</button>
    </div>
    <div class="composer-meta">
      <span class="kbd-hint">Enter — отправить · Shift+Enter — новая строка</span>
      <span class="composer-status" id="chat-status"></span>
    </div>
  </footer>
</section>

<script src="vendor/marked.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="app.js"></script>
</body>
</html>
